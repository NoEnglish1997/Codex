[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-video-editor"
version = "3.5.0"
description = "Windows 本地自动视频剪辑桌面软件"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6==6.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pyinstaller==6.22.3",
]

[project.scripts]
auto-video-editor = "auto_video_editor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires working FFmpeg and performs real media encoding",
]
