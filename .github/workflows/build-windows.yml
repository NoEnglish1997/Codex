name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg --yes --no-progress

      - name: Build and test
        shell: cmd
        run: scripts\build_windows.bat

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AutoVideoEditor-Windows-x64
          path: dist/AutoVideoEditor/
          if-no-files-found: error
